{{ define "content" }}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ .Title }} - Grant's Dissector</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
header { background: #1e293b; color: #fff; padding: 1.2rem 2rem; }
header h1 { font-size: 1.4rem; font-weight: 400; }
nav a { color: #94a3b8; text-decoration: none; font-size: 0.85rem; }
nav a:hover { color: #fff; }
.container { flex: 1; max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
.chapter-header { margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid #e2e8f0; }
.chapter-header h1 { font-size: 1.8rem; font-weight: 600; color: #1e293b; }
.chapter-header h2 { font-size: 1rem; color: #64748b; margin-top: 0.3rem; }
.content { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 2rem; }
.content h2 { font-size: 1.3rem; font-weight: 600; margin: 1.5rem 0 0.8rem; color: #1e293b; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.4rem; }
.content h3 { font-size: 1.1rem; font-weight: 600; margin: 1.2rem 0 0.6rem; color: #334155; }
.content p { font-size: 0.95rem; line-height: 1.7; color: #475569; margin-bottom: 0.8rem; }
.content ul, .content ol { padding-left: 1.5rem; margin-bottom: 0.8rem; }
.content li { font-size: 0.95rem; line-height: 1.6; color: #475569; margin-bottom: 0.3rem; }
.content strong { color: #1e293b; font-weight: 600; }
.content blockquote { border-left: 4px solid #3b82f6; padding: 0.8rem 1rem; background: #f1f5f9; border-radius: 0 8px 8px 0; margin: 1rem 0; }
.content table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.9rem; }
.content th { background: #1e293b; color: #fff; padding: 0.6rem 1rem; text-align: left; }
.content td { padding: 0.5rem 1rem; border-bottom: 1px solid #e2e8f0; }
.content tr:hover { background: #f8fafc; }
footer { text-align: center; padding: 1.5rem; color: #94a3b8; font-size: 0.8rem; border-top: 1px solid #e2e8f0; margin-top: 2rem; }
.back { display: inline-block; margin-bottom: 1rem; color: #3b82f6; text-decoration: none; font-size: 0.9rem; }
.back:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1>Grant's Dissector</h1>
</header>
<div class="container">
  <a href="/" class="back">&larr; Back to Home</a>
  <div class="chapter-header">
    <h1>{{ .Title }}</h1>
  </div>
  <div class="content">
    {{ .Content }}
  </div>
</div>
<footer>
  Grant's Dissector, 15th Edition
</footer>
</body>
</html>
{{ end }}
